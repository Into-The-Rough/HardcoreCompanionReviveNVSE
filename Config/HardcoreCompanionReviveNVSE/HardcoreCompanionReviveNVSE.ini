[General]

; Show UI messages (item removed, need item, combat restriction)
bShowMessage = 1

; Show downed companion icon and name marker
bShowIcon = 1

; Allow reviving companions while in combat
bAllowInCombat = 1

; If enabled, companions will die if not revived within fBleedoutTime
; If disabled (default), companions stay unconscious indefinitely until revived
bAllowDeath = 1

; Time in game hours before companion dies (only used if bAllowDeath=1)
fBleedoutTime = 1
